# probe-cmsis-dap-tcp.cfg - a CMSIS-DAP probe reached over TCP (e.g. an ESP32 running a CMSIS-DAP TCP
# firmware). Set the probe's address in the environment: DAP_HOST=<ip> (port 4441 unless DAP_PORT).
# For a USB CMSIS-DAP / DAPLink probe use instead: -f interface/cmsis-dap.cfg -c "transport select swd"
source [find interface/cmsis-dap-tcp.cfg]
cmsis-dap tcp host $::env(DAP_HOST)
if {[info exists ::env(DAP_PORT)]} { cmsis-dap tcp port $::env(DAP_PORT) }
transport select swd
adapter speed 200
